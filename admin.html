<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | MY DREAM GAME SHOP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070d;color:#f5f8ff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.card{background:#0a101c;border:1px solid #203252;border-radius:15px;padding:16px;margin:12px 0}.input,select{width:100%;background:#080e19;color:white;border:1px solid #203252;border-radius:9px;padding:11px;margin:5px 0}.btn{padding:10px 14px;border-radius:10px;border:1px solid #258ed0;background:#0c67a9;color:#fff;font-weight:800;cursor:pointer}.green{background:#0b704b;border-color:#37dc9b}.red{background:#6b202b;border-color:#a64252}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#a9b5ca}.status{padding:5px 9px;border-radius:99px;background:#15243b;font-size:12px}
</style></head><body><div class="wrap"><div class="row"><h1>🔐 MY DREAM GAME SHOP — แอดมิน</h1><button class="btn red" onclick="logout()">ออกจากระบบ</button></div>
<div id="loginBox"><div class="card"><h2>เข้าสู่ระบบแอดมิน</h2><input id="email" class="input" placeholder="อีเมล"><input id="password" type="password" class="input" placeholder="รหัสผ่าน"><button class="btn" onclick="login()">เข้าสู่ระบบ</button><p id="msg" class="muted"></p></div></div>
<div id="panel" style="display:none"><div class="card"><div class="row"><h2>📦 ออเดอร์</h2><button class="btn green" onclick="loadOrders()">รีเฟรช</button></div><div id="orders"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
async function login(){const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent=error.message;return}await check()}
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){loginBox.style.display="block";panel.style.display="none";return}if(user.app_metadata?.role!=="admin"){msg.textContent="บัญชีนี้ไม่มีสิทธิ์แอดมิน";await db.auth.signOut();return}loginBox.style.display="none";panel.style.display="block";loadOrders()}
async function logout(){await db.auth.signOut();check()}
async function loadOrders(){const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});if(error){orders.innerHTML="<p class='muted'>โหลดออเดอร์ไม่ได้: "+error.message+"</p>";return}orders.innerHTML=(data||[]).map(o=>`<div class="card"><div class="row"><b>${o.order_no}</b><span class="status">${statusText(o.status)}</span></div><p>${esc(o.customer_name)} • ${esc(o.customer_contact)}</p><p>${esc(o.product_name)} • ${o.duration_months} เดือน • <b>฿${Number(o.total).toLocaleString("th-TH")}</b></p><p class="muted">${esc(o.note||"")}</p><select class="input" onchange="setStatus('${o.id}',this.value)"><option value="pending" ${o.status=="pending"?"selected":""}>รอดำเนินการ</option><option value="paid" ${o.status=="paid"?"selected":""}>ชำระแล้ว</option><option value="processing" ${o.status=="processing"?"selected":""}>กำลังดำเนินการ</option><option value="done" ${o.status=="done"?"selected":""}>เสร็จสิ้น</option><option value="cancel" ${o.status=="cancel"?"selected":""}>ยกเลิก</option></select></div>`).join("")||"<p class='muted'>ยังไม่มีออเดอร์</p>"}
async function setStatus(id,status){const {error}=await db.from("orders").update({status}).eq("id",id);if(error)alert(error.message);else loadOrders()}
function statusText(s){return {pending:"รอดำเนินการ",paid:"ชำระแล้ว",processing:"กำลังดำเนินการ",done:"เสร็จสิ้น",cancel:"ยกเลิก"}[s]||s}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
check();
</script></body></html>
